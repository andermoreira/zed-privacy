name: Build Muted Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      zed_tag:
        description: 'Zed Upstream Tag to build (e.g. v1.9.0)'
        required: true
        default: 'v1.9.0'

permissions:
  contents: read

env:
  ZED_TAG: ${{ github.event.inputs.zed_tag || github.ref_name }}

jobs:
  build:
    name: Build Muted (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Muted repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            mesa-vulkan-drivers \
            strace \
            xvfb

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .zed-upstream/target
          key: ${{ matrix.os }}-${{ matrix.arch }}-cargo-${{ env.ZED_TAG }}-${{ hashFiles('patches/**') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-cargo-${{ env.ZED_TAG }}-

      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Build Script (Clone, Patch & Audit)
        run: ./scripts/build.sh --tag "${ZED_TAG}" --skip-build

      - name: Compile Release Binary
        run: |
          cd .zed-upstream
          cargo build --release --target ${{ matrix.target }} --package zed

      - name: Runtime Network Check (idle startup, no network)
        if: matrix.os == 'linux'
        run: |
          python3 scripts/runtime_network_check.py \
            --binary .zed-upstream/target/${{ matrix.target }}/release/muted \
            --log strace-network.log

      - name: Upload strace Log
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: strace-network-log
          path: strace-network.log
          if-no-files-found: ignore

      - name: Package Binary Artifact
        run: |
          mkdir -p dist
          tar -czf dist/muted-${{ matrix.target }}.tar.gz -C .zed-upstream/target/${{ matrix.target }}/release muted

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muted-${{ matrix.target }}
          path: dist/*
